name: Auto-Update Data Dragon

on:
  schedule:
    - cron: '0 0 * * *' # S'exécute tous les jours à minuit UTC
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requis pour autoriser le bot à push des commits
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20' # Assure la présence de fetch() natif
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Run DDragon Update Script
        run: npm run update-data

      - name: Regenerate and validate derived data
        run: npm run prebuild

      - name: Run tests
        run: npx vitest run

      - name: Type-check
        run: npx tsc --noEmit --incremental false

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Commit and Push changes
        run: |
          git config user.name "RuneDex Automaton"
          git config user.email "bot@runedex.app"
          git add src/data/
          
          # Vérifie s'il y a des fichiers modifiés
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): auto-update Data Dragon to latest patch"
            git push
            echo "✅ DDragon update successful and new patch pushed!"
          else
            echo "ℹ️ No Data Dragon updates found. Everything is already at the latest version."
          fi
